name: Collect Belib' data

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # allows the workflow to push commits

concurrency:
  group: collect             # never run two collections at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code (main)
        uses: actions/checkout@v4

      - name: Get the data (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Collect
        run: uv run src/belib_forecast/collect_once.py data-branch

      - name: Commit new data
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push